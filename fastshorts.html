          {
            "@type": "Question",
            "name": "What is FastShorts?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "FastShorts is a local Windows pipeline that turns a story package, a script with scene timing and visual prompts, into a finished short-form vertical video with AI-generated visuals, narration, word-level karaoke captions, music, and SFX."
            }
          },
          {
            "@type": "Question",
            "name": "Does FastShorts run locally?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The pipeline runs on your machine: composition through FFmpeg, image-to-video through ComfyUI on your own GPU, and optional local narration, image, and audio generation. Cloud services like ElevenLabs are optional steps, not requirements."
            }
          },
          {
            "@type": "Question",
            "name": "Is FastShorts for faceless channels?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Yes, that is the core use case: story-driven, narrated vertical videos produced without filming anything."
            }
          },
          {
            "@type": "Question",
            "name": "How is FastShorts different from FastClip?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "FastClip starts from footage you already have and cuts it into clips. FastShorts starts from a written story and generates the video: images, motion, narration, captions, and music."
            }
          },
          {
            "@type": "Question",
            "name": "When can I use FastShorts?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "FastShorts is experimental and the source is currently private. There is no public download yet. FastCast and FastPlay are available today, and FastShorts will be announced on the Fast Series page when it is ready."
            }
