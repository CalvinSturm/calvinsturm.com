    <script type="application/ld+json">

            "@type": "Question",
            "name": "What is FastCast?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "FastCast is a native Windows screen recorder and live streaming app for local MP4 recording, Instant Replay clips, monitor or window capture, desktop audio, microphone capture, webcam overlay, and RTMP/RTMPS streaming."
            }
          },
          {
            "@type": "Question",
            "name": "What is Instant Replay?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Instant Replay keeps the last 15 to 300 seconds of your screen in memory and saves it as an MP4 when you press Ctrl+Alt+F8. Nothing is written until you save a clip, and the buffer keeps running afterward."
            }
          },
          {
            "@type": "Question",
            "name": "Is FastCast an OBS alternative?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "FastCast is a simpler OBS alternative for focused single-scene recording and streaming workflows. OBS is still better for advanced scenes, filters, plugins, or complex broadcast production."
            }
          },
          {
            "@type": "Question",
            "name": "Does FastCast save stream keys?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Not unless you ask it to. Stream keys are session-only by default. Turning on Remember stream keys in Advanced stores them in Windows Credential Manager, encrypted by Windows under your user account, and turning it back off deletes them immediately. Keys never go into settings files, logs, or support bundles."
            }
          },
          {
            "@type": "Question",
            "name": "How much does FastCast cost?",
            "acceptedAnswer": {

            }
