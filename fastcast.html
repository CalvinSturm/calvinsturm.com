              "@type": "Answer",

            }
          },
          {
            "@type": "Question",
            "name": "Does FastCast save stream keys?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Stream keys are not saved to disk."
            }
          },
          {
            "@type": "Question",
            "name": "Is FastCast free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "FastCast Free covers 1080p recording and streaming at 30 fps, and those capabilities will stay free, with no subscription and no account. A one-time FastCast Pro license unlocks 1440p and 4K recording, 60 fps capture, and advanced encoder controls."
            }
          },
