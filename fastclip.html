    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is FastClip?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "FastClip is a Windows app that turns long local videos into ready-to-post 9:16 vertical clips. It analyzes footage on your machine, proposes ranked highlight candidates, and exports 1080x1920 MP4s with optional burned-in captions."
            }
          },
          {
            "@type": "Question",
            "name": "Does FastClip upload my footage?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. FastClip is fully local. Analysis, transcription, and export run on your machine, with no uploads, accounts, or analytics. Source files are referenced by path and never copied or modified."
            }
          },
          {
            "@type": "Question",
            "name": "Is FastClip a video editor?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. FastClip is intentionally not a nonlinear editor: there is no multi-track timeline and no general-purpose compositing. It finds, reviews, and exports vertical highlight clips."
            }
          },
          {
            "@type": "Question",
            "name": "When can I download FastClip?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "FastClip is in open beta. The latest Windows build is available now on GitHub Releases at github.com/CalvinSturm/FastClip-Releases."
            }
          },
          {
            "@type": "Question",
            "name": "Will FastClip be free?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "The plan is a free version for analyzing footage and previewing every candidate clip, with a one-time FastClip Pro license for bulk export and premium caption styles. No subscription and no monthly credits are planned."
            }
          }
        ]
